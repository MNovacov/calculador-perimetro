<ion-card class="figure-card">
    <ion-card-header>
      <ion-card-title>CÍRCULO</ion-card-title>
      <ion-card-subtitle>Perímetro</ion-card-subtitle>
    </ion-card-header>
    
    <ion-card-content>
      <div class="figure-image">
        <img src="assets/images/circulo.png" alt="Círculo">
      </div>
  
      <div class="formula-section" (click)="toggleFormula()">
        <ion-button fill="clear" class="formula-button">
          {{ mostrarFormula ? 'OCULTAR FÓRMULA' : 'MOSTRAR FÓRMULA' }}
          <ion-icon slot="end" [name]="mostrarFormula ? 'chevron-up' : 'chevron-down'"></ion-icon>
        </ion-button>
        
        <div class="formula-content" *ngIf="mostrarFormula">
          <p>El perímetro de un círculo se calcula con:</p>
          <p class="math-formula">P = 2 × π × r</p>
          <p>Donde π ≈ 3.1416 y r es el radio</p>
        </div>
      </div>
  
      <ion-item class="input-field">
        <ion-label position="stacked">Radio (cm)</ion-label>
        <ion-input 
          type="number" 
          [(ngModel)]="radio" 
          placeholder="Ingrese longitud"
        ></ion-input>
      </ion-item>
  
      <ion-button 
        expand="block" 
        color="primary" 
        class="calculate-button"
        (click)="calcular()"
        [disabled]="radio === null || radio <= 0"
      >
        CALCULAR EL PERÍMETRO
      </ion-button>
  
      <div class="result-section" *ngIf="resultado !== null">
        <h3>El perímetro es:</h3>
        <p class="result">{{ resultado | number:'1.2-2' }} cm</p>
      </div>
    </ion-card-content>
  </ion-card>
